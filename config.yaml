# ───────────────────────── Daten & Features ─────────────────────────
data:
  raw_dir: data/                 # Ordner mit den Rohdaten
  longtrend_file: longtrend.csv  # Haupt-CSV/Parquet
  numerical_cols:                # Spalten, die LongTrendDataset nutzt
    - Open
    - high
    - low
    - Close
    - Volume
    - sma_10
    - ema_20
    - rsi_14
    - hour_sin
    - hour_cos

features:
  window_sizes: [5, 10, 20]      # für SMA/EMA in utils.features.enrich
  indicators:
    - sma_20
    - ema_20
    - rsi_14
    - macd
    - bb_pct
    - atr_14
  time_features: true            # Tag/Std-Fourier-Features

# ───────────────────────── Cross-Validation ────────────────────────
cv:
  type: timeseries
  params:
    n_splits: 8                  # wird nur von utils.dataset genutzt

# ───────────────────────── Modell-Blöcke ───────────────────────────
model:
  type: hybrid_longtrend         # wird in train.py gewählt

  rf_params:
    n_estimators: 250
    max_depth: 8
    class_weight: balanced

  ft_params:                     # FT-Backbone-Grundeinstellung
    d_token: 348
    n_blocks: 4
    ffn_dropout: 0.20
    attention_dropout: 0.20

# ───────────────────────── Optionales SSL-Pretraining ──────────────
pretraining:
  enabled: false                 # true → vorab Self-Supervised
  weights_path: ft_ssl.pt
  epochs: 20
  batch_size: 256

# ───────────────────────── Training-Hyperparameter ─────────────────
training:
  seq_len: 24
  batch_size: 128
  num_train_epochs: 50
  lr: 4e-3
  lr_scheduler: cosine
  warmup_epochs: 2
  ft_optuna_epochs: 4            # Scout-Phase für FT-Optuna

# ───────────────────────── Verlustfunktion ─────────────────────────
loss:
  use_focal: true
  focal_gamma: 2.0               # 0 ⇒ nur BCEWithLogits

# ───────────────────────── Optuna-Steuerung ────────────────────────
optuna:
+optuna:
  # Globaler Fallback, wenn unten für ein Modell nichts angegeben ist
  n_trials: 1
  # Pro-Modell individuell überschreibbar:
  rf:
    n_trials: 1
  lgb:
    n_trials: 1
  xgb:
    n_trials: 1
  cnn:
    n_trials: 1
  ft:
    n_trials: 1
  meta:
    n_trials: 1
  direction: minimize            # Log-Loss ↓
  sampler: tpe
  pruner: median                 # Median-Pruner
  enable_rf:   true
  enable_lgb:  true
  enable_xgb:  true
  enable_cnn:  true
  enable_meta: true

# ───────────────────────── Meta-Transformer ────────────────────────
meta:
  use_regime: true               # ATR & Bollinger-%B anhängen
  d_token: 92
  n_blocks: 2
  d_ff: 256
  dropout: 0.10
  num_train_epochs: 30
  alpha_base_mix: 1.0  # 1.0 = nur Basis-Preds, <1.0 = Mischung mit Meta-Kopf
  
# ───────────────────────── Ausgabe-Pfad / Tag ──────────────────────
output_root: models/
exp_name: hybrid_longtrend
